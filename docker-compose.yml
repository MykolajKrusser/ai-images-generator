version: '3.8'

services:
  diffusers-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_ID=stable-diffusion-v1-5/stable-diffusion-v1-5
      - USE_FLOAT16=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
